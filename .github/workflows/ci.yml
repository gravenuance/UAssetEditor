name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # WPF (net10.0-windows) requires Windows to build.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore UAssetEditor.slnx

      # Release turns on TreatWarningsAsErrors (Directory.Build.props) and matches what
      # SingleFileRelease publishes - the same config CI and a release build both use.
      - name: Build (Release, analyzers + warnings-as-errors)
        run: dotnet build UAssetEditor.slnx -c Release --no-restore

      - name: Test Core (Release)
        run: dotnet test tests/UAssetEditor.Core.Tests/UAssetEditor.Core.Tests.csproj -c Release --no-build -- --coverage --coverage-output-format cobertura --coverage-output core-coverage.cobertura.xml

      - name: Test App (Release)
        run: dotnet test tests/UAssetEditor.App.Tests/UAssetEditor.App.Tests.csproj -c Release --no-build -- --coverage --coverage-output-format cobertura --coverage-output app-coverage.cobertura.xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            TestResults/core-coverage.cobertura.xml
            TestResults/app-coverage.cobertura.xml
          if-no-files-found: warn
