version: 2
updates:
  # Versions live in Directory.Packages.props; bumps also update each project's packages.lock.json.
  # Vendored UAssetAPI source and retoc.exe are invisible to it: run scripts/CheckDependencyUpdates.ps1
  # before a release for those.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
  # global.json pins the SDK exactly: each SDK patch moves the ILLink pack version, so a bump PR
  # must also refresh the lock files (dotnet restore --force-evaluate) before CI's locked restore passes.
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
