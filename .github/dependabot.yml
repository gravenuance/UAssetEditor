version: 2
updates:
  # Versions live in Directory.Packages.props; bumps also update each project's packages.lock.json.
  # Vendored UAssetAPI source and retoc.exe are invisible to it: run scripts/CheckDependencyUpdates.ps1
  # before a release for those.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
